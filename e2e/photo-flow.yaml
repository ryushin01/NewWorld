# 기록에 사진 여러 장을 첨부합니다. 시뮬레이터 보관함에 사진이 있어야 합니다.
appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
- runFlow: _sign-in.yaml
- tapOn:
    id: tab-my
- tapOn:
    id: my-places
- tapOn:
    id: place-row-p5
- tapOn:
    id: place-add-record
- tapOn:
    id: record-title
- inputText: 사진 기록
- hideKeyboard
- tapOn:
    id: photo-add-library
# 같은 사진을 다시 고르면 한 번만 붙습니다. iOS 선택기는 고를 때마다 사진을 새 파일로 주므로 주소가 아니라
# 보관함 ID로 거릅니다. 먼저 2장을 고른 뒤 같은 2장과 새 1장을 고르면 3장이어야 합니다(못 거르면 5장).
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: '최대 10장.*'
          timeout: 20000
      - waitForAnimationToEnd
      - tapOn:
          point: '16%,27%'
      - tapOn:
          point: '50%,27%'
      - tapOn:
          point: '90%,15%'
      - extendedWaitUntil:
          visible: '.*2/10.*'
          timeout: 20000
      - tapOn:
          id: photo-add-library
- runFlow: _pick-photos.yaml
- extendedWaitUntil:
    visible: '.*3/10.*'
    timeout: 20000
- assertNotVisible: '.*5/10.*'
- tapOn:
    id: record-save
- extendedWaitUntil:
    visible:
      id: photo-0
    timeout: 90000
- assertVisible: '.*1 / 3.*'
- tapOn:
    id: photo-0
- extendedWaitUntil:
    visible:
      id: photo-viewer-close
    timeout: 8000
# 크게 보기에도 쪽 번호가 있고, 확대하지 않았을 때는 옆으로 넘겨 다음 사진을 봅니다.
- assertVisible:
    id: photo-viewer-page
    text: '1 / 3'
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: photo-viewer-page
      text: '2 / 3'
    timeout: 5000
- tapOn:
    id: photo-viewer-close
