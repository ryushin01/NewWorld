# README 화면(데모 모드): 가입 직후 복구 코드, MY, 프로필 편집, 근처 여행지 도착 알림 안내 창
# scripts/screenshots.sh가 실행합니다. 데모 모드의 가입은 이 기기 안에만 만드는 가상 계정(아이디 traveler, 닉네임 여행자)입니다.
appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
# 설치된 앱이 데모 모드인지 먼저 확인합니다. 둘러보기 버튼은 데모 모드(Supabase 설정이 없는 빌드)에서만 보이므로,
# 서버에 연결한 빌드라면 여기서 멈춰 실제 서버에 가입하지 않습니다.
- extendedWaitUntil:
    visible:
      id: demo-browse
    timeout: 60000
- tapOn:
    id: go-sign-up
- tapOn:
    id: field-username
- inputText: traveler
- waitForAnimationToEnd
# 비밀번호 칸을 누르면 iOS의 강력한 암호 제안 시트가 먼저 뜨므로 닫고 다시 누릅니다.
- tapOn:
    id: field-password
- runFlow: ../server/_close-password-sheet.yaml
- tapOn:
    id: field-password
- inputText: readme-password
- tapOn:
    id: field-passwordConfirm
- runFlow: ../server/_close-password-sheet.yaml
- tapOn:
    id: field-passwordConfirm
- inputText: readme-password
- tapOn:
    id: field-nickname
- inputText: 여행자
# 키보드가 가입 버튼을 가립니다. 닉네임 아래 이름 칸이 있어 다음 키로는 닫히지 않으므로, 칸 밖의 안내 글자를 눌러 닫습니다.
# (비밀번호 칸의 글자는 iOS가 스크린샷에서 가리므로 화면에는 비어 보여도 입력돼 있습니다.)
- tapOn: 여권과 공유 이미지에 보이는 이름입니다.*
- waitForAnimationToEnd
- runFlow: ../_hide-keyboard-android.yaml
- scrollUntilVisible:
    element:
      id: sign-up-submit
    direction: DOWN
    centerElement: true
- tapOn:
    id: sign-up-submit
# 암호 저장 제안이 뜨면 닫습니다. 가입하면 복구 코드를 한 번 보여 줍니다.
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible: 지금 안 함
          commands:
            - tapOn: 지금 안 함
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: recovery-code-modal
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: recovery
- tapOn:
    id: recovery-code-done
- extendedWaitUntil:
    visible:
      id: world-search-real
    timeout: 20000

# MY와 프로필 편집
- tapOn:
    id: tab-my
- extendedWaitUntil:
    visible:
      id: my-profile
    timeout: 8000
- waitForAnimationToEnd
- takeScreenshot: my
- tapOn:
    id: my-profile-edit
- waitForAnimationToEnd
- takeScreenshot: profile-edit
- tapOn: 뒤로 가기

# 근처 여행지 도착 알림을 켜려고 하면 먼저 뜨는 앱 안의 안내 창(권한을 묻기 전)
- extendedWaitUntil:
    visible:
      id: my-profile
    timeout: 8000
- scrollUntilVisible:
    element:
      id: arrival-alert
    direction: DOWN
    centerElement: true
- tapOn:
    id: arrival-alert
- extendedWaitUntil:
    visible: 계속
    timeout: 8000
- waitForAnimationToEnd
- takeScreenshot: arrival
- tapOn: 취소
